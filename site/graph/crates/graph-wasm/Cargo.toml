[package]
name = "graph-wasm"
version = "0.1.0"
edition = "2021"
publish = false
description = "estudy knowledge-graph query-side helpers (search / ego / hit-test / label culling) for the canvas2D view"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.128"
js-sys = "=0.3.105"

[package.metadata.wasm-pack.profile.release]
# wasm-opt is run by wasm-pack; -Oz keeps the raw binary under the 80 KB budget.
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
