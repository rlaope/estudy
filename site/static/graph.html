<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="graph/graph.css">

<body>

<header class="gh-top">

  <h1 class="gh-title">지식 그래프</h1>
  <p class="gh-stats" id="stats" aria-live="polite">불러오는 중…</p>
</header>

<main class="gh-main">
  <section class="gh-canvas-wrap" aria-label="그래프 캔버스">
    <form class="gh-toolbar" id="toolbar" role="search" autocomplete="off">
      <label class="visually-hidden" for="q">노트 제목 검색 (초성 가능)</label>
      <input id="q" type="search" placeholder="검색 — 초성도 됩니다 (예: ㅈㄱㅎ)" spellcheck="false" enterkeyhint="search" disabled>
      <label class="gh-select">
        <span class="visually-hidden">섹션</span>
        <select id="section" disabled><option value="">섹션…</option></select>
      </label>
      <button type="button" id="toggle-scope" class="gh-btn" aria-pressed="false" disabled>전체 보기</button>
      <button type="button" id="clear" class="gh-btn" disabled>초기화</button>
      <button type="button" id="fit" class="gh-btn" title="화면에 맞춤 (0)" disabled>맞춤</button>
    </form>

    <canvas id="graph" tabindex="-1" aria-hidden="true"></canvas>

    <div id="tooltip" class="gh-tooltip" role="tooltip" hidden></div>
    <p class="gh-hint" id="hint">드래그로 이동 · 휠/핀치로 확대 · 클릭으로 노트 열기 · Esc 로 포커스 해제</p>
    <noscript>
      <p class="gh-noscript">이 페이지의 그래프 캔버스는 JavaScript 가 필요합니다. 아래 텍스트 목록은 그대로 쓸 수 있습니다.</p>
    </noscript>
  </section>

  <aside class="gh-side" id="side">
    <div class="gh-focus" id="focus" hidden>
      <h2 class="gh-h2" id="focus-title"></h2>
      <p class="gh-meta" id="focus-meta"></p>
      <div class="gh-focus-actions">
        <a id="focus-open" class="gh-btn gh-btn-primary" href="#">노트 열기</a>
        <button type="button" id="focus-ego" class="gh-btn" aria-pressed="false">이웃만 보기</button>
        <label class="gh-depth"><span>깊이</span>
          <select id="ego-depth"><option value="1">1</option><option value="2" selected>2</option><option value="3">3</option></select>
        </label>
      </div>
    </div>
    <h2 class="gh-h2" id="list-title">노트 목록</h2>
    <p class="gh-meta" id="list-meta"></p>
    <!-- 텍스트 결과/백링크 목록: JS 없음·스크린리더 기본 경로. 항목은 Tab 으로 순회하며, 포커스된 항목이 캔버스에서 포커스 링을 받는다. -->
    <ol class="gh-list" id="list" aria-labelledby="list-title">
      <li class="gh-list-empty">JavaScript 가 켜지면 890 편의 노트가 여기에 나열됩니다. <a href="./">홈 색인으로 이동</a></li>
    </ol>
  </aside>
</main>

<script type="module" src="graph/graph.js"></script>
