<!doctype html>
<html lang="ko" data-theme="system" data-mode="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지식 그래프 — estudy</title>
<meta name="description" content="estudy 노트와 섹션의 링크 관계를 한 장에 그린 지식 그래프.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="favicon-180.png">
<script>
(function () {
  var v = 'system';
  try { v = localStorage.getItem('estudy-theme') || 'system'; } catch (e) {}
  if (v !== 'light' && v !== 'dark') v = 'system';
  document.documentElement.dataset.theme = v;
  document.documentElement.dataset.mode = v;
})();
</script>
<link rel="stylesheet" href="graph/graph.css">
<link rel="modulepreload" href="graph/graph.js">
<link rel="preload" href="graph/pkg/graph_wasm_bg.wasm" as="fetch" crossorigin>
<link rel="preload" href="generated/pos.bin" as="fetch" crossorigin>
<link rel="preload" href="generated/graph.bin" as="fetch" crossorigin>
<link rel="preload" href="generated/search.json" as="fetch" crossorigin>
</head>
<body>
<a class="skip" href="#list">목록으로 건너뛰기</a>

<header class="gh-top">
  <a class="gh-home" href="./">← estudy</a>
  <h1 class="gh-title">지식 그래프</h1>
  <p class="gh-stats" id="stats" aria-live="polite">불러오는 중…</p>
  <button class="icon-btn" id="clear" type="button" aria-label="초기화" title="초기화" disabled>
    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
      <path d="M4 12a8 8 0 1 0 2.6-5.9"></path>
      <path d="M4 4.6V9h4.4"></path>
    </svg>
  </button>
  <button class="icon-btn" id="fit" type="button" aria-label="화면에 맞춤" title="화면에 맞춤" disabled>
    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
      <path d="M9 4H4v5M15 4h5v5M15 20h5v-5M9 20H4v-5"></path>
    </svg>
  </button>
  <button class="icon-btn theme-btn" id="theme" type="button" aria-label="테마: 시스템 (클릭하여 전환)" title="테마: 시스템">
    <svg class="ic ic-light" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
      <circle cx="12" cy="12" r="4.2"></circle>
      <path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4L17 7M7 17l-1.6 1.6"></path>
    </svg>
    <svg class="ic ic-dark" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
      <path d="M20 14.4A8.4 8.4 0 0 1 9.6 4a8.4 8.4 0 1 0 10.4 10.4Z"></path>
    </svg>
    <svg class="ic ic-system" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
      <rect x="3" y="4.6" width="18" height="12.4" rx="1.4"></rect>
      <path d="M9 20.4h6M12 17v3.4"></path>
    </svg>
  </button>
</header>

<!-- 검색·섹션·전체보기 같은 기능은 화면에서 뺐다(요청). URL 파라미터(?q=, ?section=)로만 쓴다. -->
<div hidden>
  <label for="q">노트 제목 검색 (초성 가능)</label>
  <input id="q" type="search" spellcheck="false" disabled>
  <label for="section">섹션</label>
  <select id="section" disabled><option value="">전체</option></select>
  <button type="button" id="toggle-scope" aria-pressed="false" disabled></button>
</div>

<main class="gh-main">
  <section class="gh-canvas-wrap" aria-label="그래프 캔버스">
    <canvas id="graph" tabindex="-1" aria-hidden="true"></canvas>
  </section>

  <aside class="gh-side" id="side">
    <div class="gh-summary" id="summary">
      <h2 class="gh-h2">그래프 요약</h2>
      <dl class="gh-facts" id="summary-facts"></dl>
      <h3 class="gh-h3">섹션</h3>
      <ol class="gh-secs" id="summary-secs"></ol>
    </div>
    <div class="gh-focus" id="focus" hidden>
      <h2 class="gh-h2" id="focus-title"></h2>
      <p class="gh-meta" id="focus-meta"></p>
      <p class="gh-excerpt" id="focus-excerpt"></p>
      <div class="gh-focus-actions">
        <a id="focus-open" class="gh-btn gh-btn-primary" href="#">열기</a>
        <button type="button" id="focus-ego" class="gh-btn" aria-pressed="false">이웃</button>
        <label class="gh-depth"><span class="visually-hidden">이웃 깊이</span>
          <select id="ego-depth" aria-label="이웃 깊이"><option value="1">1</option><option value="2" selected>2</option><option value="3">3</option></select>
        </label>
      </div>
    </div>
    <h2 class="gh-h2" id="list-title">노트</h2>
    <p class="gh-meta" id="list-meta"></p>
    <ol class="gh-list" id="list" aria-labelledby="list-title">
      <li class="gh-list-empty"><a href="./">estudy 색인</a></li>
    </ol>
  </aside>
</main>

<script type="module" src="graph/graph.js"></script>
</body>
</html>
