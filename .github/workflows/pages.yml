name: pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - uses: peaceiris/actions-hugo@v3.2.1
        with:
          hugo-version: '0.166.0'
          extended: true

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - uses: actions/configure-pages@v6.0.0
        id: pages

      - name: Build graph artifacts and staged content tree
        run: |
          cargo run --release -p graph-build -- \
            --root . --out site/generated --stage .cache/content --stage-en .cache/content-en

      - name: Build WASM graph module
        run: |
          wasm-pack build site/graph/crates/graph-wasm --release --target web \
            --out-dir ../../../static/graph/pkg --out-name graph_wasm

      - name: Build site
        run: |
          hugo --config site/hugo.toml --contentDir .cache/content \
            --destination public --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Sync English notes (auto-translate new/changed)
        env:
          OG_API_KEY: ${{ secrets.OG_API_KEY }}
        run: |
          if [ -z "${OG_API_KEY}" ]; then
            echo "OG_API_KEY 시크릿이 없어 영어 자동 동기화를 건너뜁니다"
            exit 0
          fi
          python3 tools/i18n/translate.py --all --workers 6 2>&1 | tail -6

      - name: Commit synced English notes
        run: |
          git add brains-en tools/i18n/cache
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(i18n): 영어 노트 자동 동기화 [skip ci]"
            git push
            echo "영어 노트 커밋/푸시 완료"
          else
            echo "동기화할 영어 노트 없음"
          fi

      - name: Build EN site (/en/)
        if: ${{ hashFiles('brains-en/**/*.md') != '' }}
        run: |
          python3 tools/i18n/make_index.py
          hugo --config site/hugo.toml,site/hugo.en.toml --contentDir .cache/content-en \
            --destination public/en --minify --baseURL "${{ steps.pages.outputs.base_url }}/en/"
          # 공용 자산(CSS/JS·파비콘·그래프 데이터)은 EN 트리에도 복사한다(상대 경로로 참조됨).
          cp -r public/assets public/en/ 2>/dev/null || true
          cp public/favicon-*.png public/en/ 2>/dev/null || true
          mkdir -p public/en/generated && cp site/generated/*.bin site/generated/*.json public/en/generated/
          echo "en pages: $(find public/en -name '*.html' | wc -l)"

      - name: Publish graph data artifacts
        run: |
          mkdir -p public/generated
          cp site/generated/*.bin site/generated/*.json public/generated/
          ls -l public/generated

      - name: Report build output
        run: |
          echo "pages: $(find public -name '*.html' | wc -l)"
          echo "images: $(find public -type f \( -name '*.png' -o -name '*.webp' -o -name '*.jpeg' -o -name '*.gif' \) | wc -l)"
          echo "wasm: $(find public -name '*.wasm' -exec ls -l {} \; | awk '{print $5, $9}')"
          du -sh public

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
